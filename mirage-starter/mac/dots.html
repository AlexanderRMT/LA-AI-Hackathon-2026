<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirage dot screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: #ffffff;
    --ink: #161a1e;
    --muted: #5b6670;
    --line: #cfd5da;
    --accent: #57106e;        /* inferno violet, the shift map's low end */
    --on-accent: #ffffff;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: #15181b;
      --ink: #eef1f3;
      --muted: #9aa5ae;
      --line: #2e353b;
      --accent: #fca50a;      /* inferno amber, the shift map's high end */
      --on-accent: #15181b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: #15181b; --ink: #eef1f3; --muted: #9aa5ae; --line: #2e353b;
    --accent: #fca50a; --on-accent: #15181b; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%; margin: 0; overflow: hidden; background: #ffffff;   /* the pattern's paper */
    font-family: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  }
  body.bare, body.bare * { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .panel {
    position: fixed;
    left: calc(16px + env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(310px, calc(100vw - 32px));
    padding: 14px 16px 12px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 15px; line-height: 1.35;
  }
  body.bare .panel { display: none; }
  h1 { margin: 0 0 2px; font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
  p { margin: 0 0 10px; color: var(--muted); }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 8px 0; font-weight: 500; }
  label output { font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button {
    font: inherit; font-weight: 600; padding: 7px 12px; border-radius: 7px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { margin: 10px 0 0; font-size: 13px; }
</style>
</head>
<body>
<canvas id="dots" aria-label="Random dot pattern"></canvas>
<section class="panel" id="panel">
  <h1>Dot screen</h1>
  <p>Background for the Mirage camera. Set it up once, then leave this device alone.</p>
  <label>Dot size <output id="sizeOut"></output>
    <input id="size" type="range" min="2" max="16" step="1">
  </label>
  <label>Spacing <output id="gapOut"></output>
    <input id="gap" type="range" min="1.6" max="3.2" step="0.1">
  </label>
  <div class="row">
    <button class="primary" id="hide">Hide controls</button>
    <button id="full">Full screen</button>
    <button id="seed">New pattern</button>
  </div>
  <p class="status" id="awake"></p>
  <p class="status">Aim for dots about 3 camera pixels wide. Brightness all the way up, auto-brightness,
    True Tone and Night Shift off, charger in. Tap or press any key to bring these controls back.</p>
</section>
<script>
(() => {
  const canvas = document.getElementById("dots");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const saved = (() => { try { return JSON.parse(localStorage.getItem("mirage-dots") || "{}"); } catch (e) { return {}; } })();
  const state = { size: saved.size || 6, gap: saved.gap || 2.2, seed: saved.seed || 20261017 };

  function rng(seed) {                       // mulberry32: same seed, same pattern, every reload
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
    canvas.width = w; canvas.height = h;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#000000";
    const d = state.size * dpr, cell = d * state.gap, r = d / 2, rand = rng(state.seed);
    // One dot per cell at a random spot inside it: even texture with no empty patches, which
    // optical flow needs everywhere it measures.
    for (let y = 0; y < h + cell; y += cell) {
      for (let x = 0; x < w + cell; x += cell) {
        const cx = x + r + rand() * (cell - d), cy = y + r + rand() * (cell - d);
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    $("sizeOut").value = state.size + " px";
    $("gapOut").value = state.gap.toFixed(1) + "\u00d7 dot size";
    try { localStorage.setItem("mirage-dots", JSON.stringify(state)); } catch (e) {}
  }

  $("size").value = state.size; $("gap").value = state.gap;
  $("size").addEventListener("input", (e) => { state.size = +e.target.value; draw(); });
  $("gap").addEventListener("input", (e) => { state.gap = +e.target.value; draw(); });
  $("seed").addEventListener("click", () => { state.seed = (Math.random() * 2 ** 31) | 0; draw(); });

  function setBare(bare) { document.body.classList.toggle("bare", bare); }
  $("hide").addEventListener("click", (e) => { e.stopPropagation(); setBare(true); });
  canvas.addEventListener("click", () => setBare(false));

  const root = document.documentElement;
  const canFull = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  function full() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
  if (!canFull) $("full").hidden = true; else $("full").addEventListener("click", full);

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (k === "h") { setBare(!document.body.classList.contains("bare")); return; }
    if (k === "f" && canFull) { full(); return; }
    if (k === "n") { $("seed").click(); return; }
    if (k === "+" || k === "=") { state.size = Math.min(16, state.size + 1); $("size").value = state.size; draw(); return; }
    if (k === "-" || k === "_") { state.size = Math.max(2, state.size - 1); $("size").value = state.size; draw(); return; }
    setBare(false);
  });

  let lock = null;
  async function keepAwake() {
    if (!("wakeLock" in navigator)) {
      $("awake").textContent = "This browser can\u2019t keep the screen awake: set auto-lock and sleep to never.";
      return;
    }
    try {
      lock = await navigator.wakeLock.request("screen");
      $("awake").textContent = "The screen will stay awake while this page is open.";
      lock.addEventListener("release", () => { $("awake").textContent = "Screen may sleep: tap the pattern to keep it awake."; });
    } catch (e) {
      $("awake").textContent = "Couldn\u2019t keep the screen awake yet: tap the pattern once.";
    }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
  canvas.addEventListener("click", keepAwake);
  keepAwake();

  let t = null;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 120); });
  draw();
})();
</script>
</body>
</html>
